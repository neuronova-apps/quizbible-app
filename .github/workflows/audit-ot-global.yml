name: Auditoría Global del Antiguo Testamento

on:
  workflow_dispatch:
  push:
    branches:
      - audit-genesis-full-rvr1960
    paths:
      - 'tools/bible_extractor/audit_ot_global.py'
      - 'tools/bible_extractor/test_audit_ot_global.py'
      - 'tools/bible_extractor/ot-global-manifest-v1.json'
      - '.github/workflows/audit-ot-global.yml'
  pull_request:
    branches:
      - audit-genesis-full-rvr1960
    paths:
      - 'tools/bible_extractor/audit_ot_global.py'
      - 'tools/bible_extractor/test_audit_ot_global.py'
      - 'tools/bible_extractor/ot-global-manifest-v1.json'
      - '.github/workflows/audit-ot-global.yml'

jobs:
  audit-ot-global:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests flake8 mypy pytest beautifulsoup4

      - name: Ejecutar verificación de calidad web y SEO
        run: python scripts/quality_check.py

      - name: Ejecutar batería de pruebas de auditor individual
        run: python tools/bible_extractor/test_auditor.py

      - name: Ejecutar batería de pruebas de auditor global
        run: python tools/bible_extractor/test_audit_ot_global.py

      - name: Ejecutar batería de pruebas de exportación runtime
        run: python tools/runtime_export/test_export_runtime.py

      - name: Ejecutar Auditoría Global del Antiguo Testamento
        run: python tools/bible_extractor/audit_ot_global.py --output-dir build/audit/ot-global

      - name: Subir artefacto de auditoría global
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-global-at-rvr1960-${{ github.run_number }}
          path: build/audit/ot-global/
          if-no-files-found: error
          retention-days: 90
