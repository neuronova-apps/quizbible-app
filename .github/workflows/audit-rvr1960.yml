  workflow_dispatch:
    inputs:
      input_file:
        description: "Ruta del archivo de entrada de preguntas"
        required: true
        default: "tools/bible_extractor/revelation-master-input.json"
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría textual derivada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias de auditoría
        run: |
          python tools/bible_extractor/test_auditor.py

      - name: Determinar archivo de entrada y destino
        id: select_input
        env:
          INPUT_FILE_INPUT: ${{ inputs.input_file }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - << 'EOF'
          import os, json, sys
          from pathlib import Path

          input_file = os.environ.get("INPUT_FILE_INPUT", "").strip()
          run_number = os.environ.get("RUN_NUMBER", "0").strip()

          repo_root = Path(".")
          extractor_dir = repo_root / "tools" / "bible_extractor"

          priority_order = [
              "revelation", "jude", "3john", "2john", "1john", "2peter", "1peter", "james", "hebrews", "philemon", "titus", "2timothy", "1timothy",
              "2thessalonians", "1thessalonians", "colossians", "philippians",
              "ephesians", "galatians", "2corinthians", "1corinthians", "romans",
              "acts", "john", "luke", "mark", "matthew",
              "malachi", "zechariah", "haggai", "zephaniah", "habakkuk", "nahum",
              "micah", "jonah", "obadiah", "amos", "joel", "hosea",
              "daniel", "ezekiel", "lamentations", "jeremiah", "isaiah",
              "song-of-songs", "ecclesiastes", "proverbs", "psalms", "job",
              "esther", "nehemiah", "ezra", "2chronicles", "1chronicles",
              "2kings", "1kings", "2samuel", "1samuel", "ruth", "judges",
              "joshua", "deuteronomy", "numbers", "leviticus", "exodus", "genesis"
          ]

          if not input_file:
              for book in priority_order:
                  p = extractor_dir / f"{book}-master-input.json"
                  if p.exists():
                      input_file = str(p.relative_to(repo_root)).replace("\\", "/")
                      break
              if not input_file:
                  audit_p = extractor_dir / "audit-input.json"
                  if audit_p.exists():
                      input_file = str(audit_p.relative_to(repo_root)).replace("\\", "/")
                  else:
                      print("No se encontró archivo de entrada de auditoría.")
                      sys.exit(1)

          sys.path.insert(0, str(repo_root))
          from tools.bible_extractor.auditor import BOOK_CONFIGS, detect_book_key

          with open(repo_root / input_file, "r", encoding="utf-8") as f:
              raw_data = json.load(f)

          book_key = detect_book_key(raw_data)
          cfg = BOOK_CONFIGS.get(book_key, BOOK_CONFIGS["genesis"])

          output_dir = cfg.get("default_output_dir", f"build/audit/{book_key}")
          canonical_lower = cfg["canonical_name"].lower()
          canonical_slug = canonical_lower.replace(" ", "-").replace("á", "a").replace("é", "e").replace("í", "i").replace("ó", "o").replace("ú", "u")
          if canonical_slug == "cantar-de-los-cantares":
              canonical_slug = "cantar"

          artifact_name = f"auditoria-{canonical_slug}-rvr1960-{run_number}"

          gh_output = os.environ.get("GITHUB_OUTPUT")
          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as f:
                  f.write(f"selected_file={input_file}\n")
                  f.write(f"output_dir={output_dir}\n")
                  f.write(f"artifact_name={artifact_name}\n")

          print(f"selected_file={input_file}")
          print(f"output_dir={output_dir}")
          print(f"artifact_name={artifact_name}")
          print(f"Archivo seleccionado: {input_file} -> Salida: {output_dir}")
          EOF

      - name: Auditar preguntas con ApiBiblia RVR1960
        env:
          APIBIBLIA_API_KEY: ${{ secrets.APIBIBLIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/bible_extractor/auditor.py \
            --input "${{ steps.select_input.outputs.selected_file }}" \
            --output-dir "${{ steps.select_input.outputs.output_dir }}"

      - name: Validar que no se persiste texto bíblico
        env:
          TARGET_DIR: ${{ steps.select_input.outputs.output_dir }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          
          out_dir = Path(os.environ.get('TARGET_DIR', 'build/audit/genesis'))
          json_files = list(out_dir.glob('*.json'))
          assert len(json_files) > 0, "No se generaron archivos derivados de auditoría."
          
          for jf in json_files:
              data = json.loads(jf.read_text(encoding='utf-8'))
              print(f"Validando {jf.name}...")
              assert data.get('source_text_persisted') is False, f"source_text_persisted no es False en {jf.name}"
              
              # Validar recursivamente que no existan campos 'text' ni 'verse_text' con contenido bíblico
              def assert_no_scripture(node):
                  if isinstance(node, dict):
                      assert 'text' not in node and 'verse_text' not in node, f"Campo de texto bíblico encontrado en {jf.name}"
                      for v in node.values():
                          assert_no_scripture(v)
                  elif isinstance(node, list):
                      for item in node:
                          assert_no_scripture(item)
              
              assert_no_scripture(data)
          PY

      - name: Generar informe oficial de auditoría
        run: |
          python tools/bible_extractor/report_audit.py \
            --output-dir "${{ steps.select_input.outputs.output_dir }}" \
            --master-input "${{ steps.select_input.outputs.selected_file }}"

      - name: Publicar resultados derivados
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.select_input.outputs.artifact_name }}
          path: ${{ steps.select_input.outputs.output_dir }}/
          retention-days: 7
