        type: string

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría textual derivada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias de auditoría
        run: |
          python tools/bible_extractor/test_auditor.py

      - name: Determinar archivo de entrada y destino
        id: select_input
        run: |
          INPUT_FILE="${{ inputs.input_file || '' }}"
          if [ -z "$INPUT_FILE" ]; then
            if [ -f "tools/bible_extractor/mark-master-input.json" ]; then
              INPUT_FILE="tools/bible_extractor/mark-master-input.json"
